<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地番ハイライトマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <h1>地番ハイライトマップ</h1>
    <div class="toolbar-buttons">
      <button id="btn-top">TOPに戻る</button>
      <button id="btn-print">印刷プレビュー</button>
      <button id="btn-pdf">PDFに保存</button>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar">
      <section class="panel">
        <h2>住所・地番を入力</h2>
        <textarea id="address-input" placeholder="1行に1件ずつ入力してください&#10;例:&#10;愛媛県伊予市上三谷2293-1&#10;愛媛県伊予市上三谷2289-1&#10;愛媛県伊予市上野1972"></textarea>
        <button id="btn-apply">反映してハイライト</button>
        <div id="parse-errors" class="errors"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>選択中リスト (<span id="selection-count">0</span>)</h2>
          <button id="btn-clear-all">全解除</button>
        </div>
        <ul id="selection-list"></ul>
      </section>

      <p class="hint">地図上の筆をクリックしても追加・削除できます。</p>
    </aside>

    <main id="map-container">
      <div id="map"></div>
      <div id="loading" class="hidden">読み込み中...</div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
